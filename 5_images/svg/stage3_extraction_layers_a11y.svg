<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950" role="img" aria-labelledby="title desc">
  <title id="title">Stage 3 Extraction Layers</title>
  <desc id="desc">Separated accessibility-specific extraction layers for graph learning: structural, semantic, text, visual and weak-label extraction.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#1f2937"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 40px Arial;fill:#111827}.sub{font:400 20px Arial;fill:#4b5563}.h{font:700 22px Arial;fill:#111827}.label{font:700 17px Arial;fill:#111827}.body{font:400 15px Arial;fill:#374151}.small{font:400 13px Arial;fill:#475569}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:20}.layer{fill:#fff7ed;stroke:#fdba74;stroke-width:1.5;rx:14}.out{fill:#f0fdfa;stroke:#5eead4;stroke-width:1.5;rx:14}.warn{fill:#fff1f2;stroke:#fb7185;stroke-width:1.5;rx:14}.arrow{stroke:#1f2937;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.thin{stroke:#cbd5e1;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1500" height="950"/>
  <text class="title" x="750" y="60" text-anchor="middle">3. Extraction Layers</text>
  <text class="sub" x="750" y="92" text-anchor="middle">Accessibility-specific signals are extracted separately before being combined for graph learning</text>

  <rect class="panel" x="55" y="145" width="280" height="680"/>
  <text class="h" x="195" y="190" text-anchor="middle">Input Page Graph</text>
  <circle cx="195" cy="280" r="42" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/><text class="label" x="195" y="285" text-anchor="middle">Button</text>
  <circle cx="125" cy="390" r="40" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/><text class="label" x="125" y="395" text-anchor="middle">Image</text>
  <circle cx="265" cy="390" r="40" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/><text class="label" x="265" y="395" text-anchor="middle">Input</text>
  <circle cx="195" cy="510" r="42" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/><text class="label" x="195" y="515" text-anchor="middle">Label</text>
  <path class="thin" d="M181 319 L139 355M209 319 L251 355M251 425 L214 475"/>
  <text class="body" x="195" y="635" text-anchor="middle">Each node carries page evidence</text>
  <text class="small" x="195" y="665" text-anchor="middle">structure, semantics, text, layout</text>
  <text class="small" x="195" y="690" text-anchor="middle">and audit-derived supervision</text>

  <path class="arrow" d="M335 485 L410 485"/>

  <rect class="panel" x="410" y="125" width="650" height="720"/>
  <text class="h" x="735" y="170" text-anchor="middle">Separated Extraction Layers</text>

  <rect class="layer" x="455" y="215" width="560" height="90"/>
  <text class="label" x="485" y="248">Structural Extraction</text>
  <text class="body" x="485" y="278">Example signals: element depth, parent section, nearby siblings, reading order, graph centrality</text>

  <rect class="layer" x="455" y="330" width="560" height="90"/>
  <text class="label" x="485" y="363">Semantic and Accessibility Extraction</text>
  <text class="body" x="485" y="393">Example signals: role is button, image requires name, input has associated label, landmark membership</text>

  <rect class="layer" x="455" y="445" width="560" height="90"/>
  <text class="label" x="485" y="478">Text Extraction</text>
  <text class="body" x="485" y="508">Example signals: visible text "Buy now", empty image description, repeated link text, help text nearby</text>

  <rect class="layer" x="455" y="560" width="560" height="90"/>
  <text class="label" x="485" y="593">Visual Extraction</text>
  <text class="body" x="485" y="623">Example signals: bounding region, visibility, overlap, contrast-sensitive context, spatial proximity</text>

  <rect class="warn" x="455" y="675" width="560" height="105"/>
  <text class="label" x="485" y="708">Weak-Label Extraction</text>
  <text class="body" x="485" y="738">Example labels: image missing alternative text, form field missing name, page contains violations</text>
  <text class="small" x="485" y="762">Labels are derived from automated audit evidence and attached to graph nodes, rules and pages</text>

  <path class="arrow" d="M1060 485 L1135 485"/>

  <rect class="panel" x="1135" y="145" width="310" height="680"/>
  <text class="h" x="1290" y="190" text-anchor="middle">Combined Learning Input</text>
  <rect class="out" x="1178" y="250" width="224" height="105"/>
  <text class="label" x="1290" y="285" text-anchor="middle">Node Feature Vector</text>
  <text class="body" x="1290" y="317" text-anchor="middle">accessibility-aware</text>
  <text class="body" x="1290" y="339" text-anchor="middle">representation</text>
  <rect class="out" x="1178" y="410" width="224" height="105"/>
  <text class="label" x="1290" y="445" text-anchor="middle">Graph Structure</text>
  <text class="body" x="1290" y="477" text-anchor="middle">relations used for</text>
  <text class="body" x="1290" y="499" text-anchor="middle">message passing</text>
  <rect class="out" x="1178" y="570" width="224" height="125"/>
  <text class="label" x="1290" y="605" text-anchor="middle">Weak Labels</text>
  <text class="body" x="1290" y="637" text-anchor="middle">element, rule and</text>
  <text class="body" x="1290" y="659" text-anchor="middle">page supervision</text>

  <text class="sub" x="750" y="890" text-anchor="middle">Output: a graph-learning example that combines a11y features, relationships and audit-derived supervision</text>
</svg>
